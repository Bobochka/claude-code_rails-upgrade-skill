# Fixture expectations for rails-41-patterns.yml.
#
# Keyed by variable_name (matching the entries in rails-41-patterns.yml). For
# each pattern you cover, list:
#   match     - lines the pattern MUST flag (the real breaking-change shapes)
#   no_match  - lines it MUST NOT flag (safe code + known false-positive traps)
#
# A line is "flagged" when the entry's `pattern` regex matches it AND the
# entry's `exclude` regex (when present) does not — a per-line grep + grep -v.
#
# Run with:
#   bin/test-patterns rails-upgrade/detection-scripts/patterns/rails-41-patterns.yml

CACHE_DIGESTS_BACKPORT:
  match:
    - "gem 'cache_digests'"
    - "  gem \"cache_digests\", \"~> 0.3.1\""
    - "    CacheDigests::TemplateDigestor.digest(name, :html, lookup_context)"
    - "  CacheDigests.cache = ActiveSupport::Cache::MemoryStore.new"
  no_match:
    - "gem 'cache_digest'"
    - "# gem 'cache_digests'"
    - "gem 'cache_digests' unless NextRails.next?"
    - "  ActionView::Digestor.digest(name: name, finder: lookup_context)"
    - "  config.action_view.cache_template_loading = true"
    - "  <% cache [@post, 'v3'] do %>"

# The pattern also spans up to four lines (a helper call whose confirm: sits on
# a continuation line). Fixtures are per line, so that multi-line shape is
# covered by the scanner, not by these fixtures. A bare `confirm:` line on its
# own is a no_match here for the same reason.
CONFIRM_OPTION:
  match:
    - "<%= link_to \"Delete\", post_path(@post), method: :delete, confirm: \"Are you sure?\" %>"
    - "= link_to 'Remove', item_path(item), :confirm => 'Really remove?', :method => :delete"
    - "<%= button_to \"Destroy\", @post, method: :delete, confirm: t(\"posts.confirm_destroy\") %>"
    - "<%= submit_tag \"Save\", confirm: \"Save changes?\" %>"
    - "<%= f.submit \"Publish\", :confirm => \"Publish now?\" %>"
    - "<%= image_submit_tag \"go.png\", confirm: \"Continue?\" %>"
  no_match:
    - "<%= link_to \"Delete\", post_path(@post), method: :delete, data: { confirm: \"Are you sure?\" } %>"
    - "= link_to 'Remove', item_path(item), :data => { :confirm => 'Really remove?' }, :method => :delete"
    - "<%= button_to \"Destroy\", @post, \"data-confirm\" => \"Sure?\" %>"
    - "<%= link_to \"Confirm email\", confirm_email_path(token: @token) %>"
    - "<%= f.submit \"Save\", data: { disable_with: \"Saving...\", confirm: \"Save?\" } %>"
    - "      confirm: \"Are you sure?\","
    - "<%= f.password_field :password_confirmation %>"
